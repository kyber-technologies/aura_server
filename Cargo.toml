cargo-features = ["profile-rustflags"]

[package]
name = "aura-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "time", "parking_lot"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tokio-stream = { version = "0.1.19", default-features = false }

tracing = { version = "0.1.44", features = ["max_level_info"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "ansi", "fmt"] }

tonic = { version = "0.14.6", default-features = false, features = ["server", "router", "gzip"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["tonic"] }

diesel = { version = "2.3.13", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "migrations"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
pgvector = { version = "0.4.2", features = ["diesel", "postgres"] }
fastembed = { version = "7.0.1", default-features = false, features = ["hf-hub"] }

jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
nanoid = "0.5.0"

dashmap = "7.0.0-rc2"
ahash = "0.8.12"
fastrand = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "serde"] }
smol_str = "0.3.6"

lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "tokio1", "ring", "rustls-native-certs"] }
tera = { version = "2.4.0", features = ["fast"] }

rustyline-async = "0.4.9"
no-pico-args = "0.5.1"
shlex = "2.0.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

aura_rust = { git = "https://github.com/kyber-technologies/aura_proto.git" }

[features]
default = []
testing = []
